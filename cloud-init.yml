#cloud-config
users:
  - name: ${username}
    groups: sudo
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys: 
      - ${ssh_public_key}
package_update: true
package_upgrade: false
packages:
  - curl
  - git
  - jq
runcmd:
  - sudo echo "ubuntu:Qwerty1" | sudo chpasswd
