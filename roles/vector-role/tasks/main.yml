---
# tasks file for vector-role
- name: Create vector group
  ansible.builtin.group:
    name: vector
    system: true

- name: Create vector user
  ansible.builtin.user:
    name: vector
    group: vector
    groups: systemd-journal
    append: true
    system: true

- name: Create vector directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: vector
    group: vector
    mode: '0755'
  loop:
    - "{{ vector_install_dir }}"
    - "{{ vector_data_dir }}"
    - "{{ vector_config_dir }}"

- name: Download Vector archive
  ansible.builtin.get_url:
    url: "{{ vector_archive_url }}"
    dest: "/tmp/vector-{{ vector_version }}.tar.gz"
    mode: '0644'

- name: Unarchive Vector
  ansible.builtin.unarchive:
    src: "/tmp/vector-{{ vector_version }}.tar.gz"
    dest: "{{ vector_install_dir }}"
    remote_src: true
    extra_opts: ["--strip-components=2"]
    owner: vector
    group: vector
    creates: "{{ vector_install_dir }}/bin/vector"

- name: Create symlink for vector binary
  ansible.builtin.file:
    src: "{{ vector_install_dir }}/bin/vector"
    dest: "/usr/local/bin/vector"
    state: link

- name: Deploy Vector configuration from template
  ansible.builtin.template:
    src: "vector.toml.j2"
    dest: "{{ vector_config_file }}"
    owner: vector
    group: vector
    mode: '0644'
  notify: Restart Vector

- name: Install systemd unit for Vector
  ansible.builtin.template:
    src: "vector.service.j2"
    dest: "/etc/systemd/system/vector.service"
    mode: '0644'
  notify: Reload systemd

- name: Ensure Vector service is enabled and started
  ansible.builtin.systemd:
    name: vector
    enabled: true
    state: started
