---
# ====================================================================
# PLAY 1: Установка ClickHouse (Выполняется только на clickhouse)
# ====================================================================
- name: Install Clickhouse
  hosts: clickhouse
  roles:
    - clickhouse-role
# ====================================================================
# PLAY 2: Установка Vector (Выполняется только на vector)
# ====================================================================
- name: Install Vector
  hosts: vector
  become: true
  roles:
    - vector-role
# ====================================================================
# PLAY 3: Установка LightHouse (Выполняется только на lighthouse)
# ====================================================================
- name: Install LightHouse
  hosts: lighthouse
  become: true
  roles:
    - lighthouse-role
